<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prince Bingwa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1 class="title">PRINCE BINGWA</h1>
        <p class="subtitle">Agent Prince Bingwa Statistics</p>

        <div class="stats-grid">

            <div class="card green">
                <div class="circle"></div>
                <h2 id="totalPurchase">2,389</h2>
                <p>Total Purchase</p>
            </div>

            <div class="card blue">
                <div class="circle"></div>
                <h2 id="todayPurchase">678</h2>
                <p>Today Purchase</p>
            </div>

            <div class="card purple">
                <div class="circle"></div>
                <h2 id="todaySuccess">678</h2>
                <p>Today Successful Purchase</p>
            </div>

            <div class="card red">
                <div class="circle"></div>
                <h2 id="issues">0</h2>
                <p>Issues</p>
            </div>

        </div>

        <div class="footer-message">
            Keep restarting your bot after every 24hrs for successful execution of bundles to clients
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
